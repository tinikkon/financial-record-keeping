name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  formula-engine:
    name: Движок формул
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Собрать образ PHP
        run: docker compose build sheet-app

      - name: Установить зависимости
        run: |
          docker run --rm -v "$PWD":/app -w /app/packages/formula-engine \
            -e COMPOSER_HOME=/tmp/composer finance-sheet-app:latest \
            composer install --no-interaction --no-progress

      - name: Статический анализ
        run: |
          docker run --rm -v "$PWD":/app -w /app/packages/formula-engine \
            finance-sheet-app:latest vendor/bin/phpstan analyse --no-progress

      - name: Тесты
        run: |
          docker run --rm -v "$PWD":/app -w /app/packages/formula-engine \
            finance-sheet-app:latest vendor/bin/pest

  services:
    name: Сервисы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Подготовить окружение
        run: |
          cp .env.example .env
          make keys
          docker compose build sheet-app

      - name: Поднять хранилище и очередь
        run: |
          docker compose up -d mongo mongo-replica-set-init rabbitmq
          docker compose wait mongo-replica-set-init
          timeout 180 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" "$(docker compose ps -q mongo)")" = healthy ]; do sleep 3; done'

      - name: Установить зависимости
        run: |
          for service in sheet-service history-service; do
            docker run --rm -v "$PWD":/app -w "/app/services/$service/src" \
              -e COMPOSER_HOME=/tmp/composer finance-sheet-app:latest \
              composer install --no-interaction --no-progress
          done

      - name: Статический анализ
        run: |
          for service in sheet-service history-service; do
            docker run --rm --network finance_finance -v "$PWD":/app -w "/app/services/$service/src" \
              finance-sheet-app:latest vendor/bin/phpstan analyse --no-progress
          done

      - name: Тесты
        run: |
          for service in sheet-service history-service; do
            docker run --rm --network finance_finance -v "$PWD":/app -w "/app/services/$service/src" \
              -v "$PWD/docker/secrets":/run/secrets:ro \
              finance-sheet-app:latest sh -c 'php artisan key:generate --force && php artisan finance:create-indexes && vendor/bin/pest'
          done

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
        env:
          VITE_SHEET_API_URL: http://localhost
          VITE_HISTORY_API_URL: http://localhost
          VITE_WEBSOCKET_HOST: localhost
          VITE_WEBSOCKET_PORT: '8088'
          VITE_WEBSOCKET_KEY: ключ

  end-to-end:
    name: Сквозные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Подготовить окружение
        run: |
          cp .env.example .env
          make keys

      - name: Собрать образы и поставить зависимости
        run: |
          docker compose build
          make install

      - name: Поднять окружение
        run: |
          docker compose up -d
          timeout 300 bash -c 'until curl -sf -o /dev/null -H "Host: finance.localhost" http://localhost:8088/; do sleep 5; done'

      - name: Индексы и пользователи
        run: |
          docker compose exec -T sheet-app php artisan finance:create-indexes
          docker compose exec -T history-app php artisan finance:create-indexes
          make users

      - name: Поставить Playwright
        run: |
          docker build -q -t finance-e2e:latest e2e
          docker run --rm -v "$PWD/e2e":/e2e -w /e2e finance-e2e:latest npm ci

      - name: Прогон в браузере
        run: make test-e2e

      - name: Отчёт о падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: сквозные-тесты
          path: e2e/test-results
